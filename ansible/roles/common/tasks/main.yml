---
- name: Refresh apt metadata when cache is older than one hour
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [common, packages]

- name: Install required base and troubleshooting packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
  tags: [common, packages]

- name: Detect a running systemd instance rather than installed binaries
  ansible.builtin.stat:
    path: /run/systemd/system
  register: systemd_runtime
  tags: [common]

- name: Set the configured system timezone when systemd is running
  community.general.timezone:
    name: "{{ timezone }}"
  when: systemd_runtime.stat.isdir | default(false)
  tags: [common]

- name: Explain timezone skip on systems without systemd
  ansible.builtin.debug:
    msg: "Skipping timezone management because systemd is not running in this target."
  when: not (systemd_runtime.stat.isdir | default(false))
  tags: [common]
